name: Build & deploy duckwalksneakers.com

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours (UTC). eBay API License 8.1(c): displayed data must be <= 6h old; 3h leaves room for GitHub cron delays.
  workflow_dispatch:         # "Run workflow" button for a manual refresh
    inputs:
      create_pages_project:
        description: "First run only: create the Cloudflare Pages project 'duckwalksneakers' (production branch main) before deploying"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # commit data/live/registry.json (model names/slugs only, no listing data) so sold-out pages are never lost

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from live eBay listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SELLER_USERNAME: ${{ vars.EBAY_SELLER_USERNAME }}
          EPN_CAMPAIGN_ID: ${{ vars.EPN_CAMPAIGN_ID }}
          REQUIRE_LIVE: "1"     # never publish sample data
        run: python build.py
      - name: Save model registry (keeps sold-out pages forever)
        run: |
          git config user.name "duckwalk-bot"
          git config user.email "duckwalk-bot@users.noreply.github.com"
          git add data/live/registry.json data/live/model_content.json
          git diff --cached --quiet || git commit -m "Update model registry [skip ci]"
          git push
      # Cloudflare Pages Direct Upload of the prebuilt site/ folder (no Cloudflare-side build, so it
      # does not use the free plan's 500 builds/month; 8 runs/day is about 248 deploys/month anyway).
      - name: Deploy site/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: ${{ inputs.create_pages_project && 'wrangler pages project create duckwalksneakers --production-branch=main' || 'echo "Pages project already exists"' }}
          command: pages deploy site --project-name=duckwalksneakers --branch=main
